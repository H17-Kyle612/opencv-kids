<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ケーキぱくぱく AI実況</title>
<style>
@font-face{font-family:BIZ;src:url('font.ttf');font-display:swap}
*{box-sizing:border-box}
body{font:16px/1.65 BIZ,sans-serif;background:#102d28;color:#f7f4e9;max-width:720px;margin:clamp(20px,6vw,64px) auto;padding:0 18px}
h1{font-size:24px;margin:0 0 12px}
h2{font-size:16px;margin:16px 0 6px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{font:inherit;padding:8px 14px;border:1px solid #638075;border-radius:8px;background:#193e35;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
#start{background:#ffe599;color:#173a31;border-color:#ffe599}
#status{color:#c4d8d0;font-size:14px}
#transcript{font-size:20px;color:#fff3cf;margin:14px 0 0}
#transcript:empty{display:none}
audio{width:100%;margin-top:12px}
details{border-top:1px solid #416157;margin-top:18px;padding-top:10px}
summary{cursor:pointer;color:#ffe599}
textarea,select{font:inherit;color:inherit;background:#0b221d;border:1px solid #75978b;border-radius:8px;padding:8px;max-width:100%}
textarea{width:100%;resize:vertical}
label{display:block;margin:10px 0 4px}
small{color:#c4d8d0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 monospace;max-height:270px;overflow:auto;background:#0b221d;padding:10px;border-radius:6px}
.scroll{overflow:auto}
table{width:100%;font-size:12px;border-collapse:collapse}
td,th{text-align:left;padding:6px;border-bottom:1px solid #416157;vertical-align:top}
#metrics{white-space:pre-line}
</style>
<main>
<h1>ケーキぱくぱく実況</h1>
<div class="controls">
  <button id="start" disabled>実況を開始</button>
  <button id="stop" disabled>停止</button>
  <span id="status" role="status">接続待ち</span>
</div>
<audio id="audio" controls autoplay hidden></audio>
<p id="transcript" aria-live="polite"></p>

<details>
  <summary>実況の設定</summary>
  <label for="voice">声</label>
  <select id="voice" disabled><option>読み込み中…</option></select>
  <label for="editor">演出プロンプト</label>
  <textarea id="editor" rows="6" maxlength="12000" spellcheck="false" disabled></textarea>
  <div class="controls">
    <button id="apply" disabled>保存して反映</button>
    <button id="reset" disabled>標準の実況文に戻す</button>
  </div>
  <p><small id="settingsStatus" role="status">設定を読み込んでいます…</small></p>
  <small id="activeSettings">実況は未接続</small>
</details>

<details id="diagnostics">
  <summary>診断</summary>
  <p id="metrics">送信待ち</p>
  <h2>最新のゲーム状況</h2><small id="captured">未取得</small><pre id="current">データ待ち</pre>
  <h2>実際に送った内容</h2><small id="sentAt">未送信</small><pre id="payload">データ待ち</pre>
  <details><summary>送信パラメータ</summary><pre id="request"></pre></details>
  <details><summary>適用中のシステムプロンプト</summary><pre id="prompt">取得中</pre></details>
  <h2>送信履歴（最新30件）</h2>
  <div class="scroll"><table><thead><tr><th>番号・時刻</th><th>状態・反応</th><th>見せ場</th><th>待ち／受付</th></tr></thead><tbody id="history"></tbody></table></div>
  <h2>ブラウザの音声検出（最新20件）</h2><pre id="audioLog">音声未検出</pre>
</details>
</main>
<script type="module" src="player.js"></script></html>
